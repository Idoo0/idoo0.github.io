<dialog class="project-dialog" id="project-dialog" aria-labelledby="project-dialog-title" aria-describedby="project-dialog-summary">
    <div class="project-dialog-header">
      <p>PROJECT DETAILS</p>
      <button class="project-dialog-close" id="project-dialog-close" type="button" aria-label="Close project details" autofocus><svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="m4 4 8 8M12 4l-8 8" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg></button>
    </div>
    <div id="project-dialog-content"></div>
  </dialog>
  <dialog class="project-dialog photo-dialog" id="photo-dialog" aria-labelledby="photo-dialog-title" aria-describedby="photo-dialog-caption">
    <div class="project-dialog-header">
      <p id="photo-dialog-title">PHOTO PREVIEW</p>
      <button class="project-dialog-close" id="photo-dialog-close" type="button" aria-label="Close photo preview" autofocus><svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="m4 4 8 8M12 4l-8 8" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg></button>
    </div>
    <figure class="photo-dialog-figure">
      <img id="photo-dialog-image" alt="" decoding="async" hidden>
      <p id="photo-dialog-status" role="status" hidden></p>
      <figcaption id="photo-dialog-caption"></figcaption>
    </figure>
  </dialog>
  <dialog class="project-dialog" id="achievement-dialog" aria-labelledby="achievement-dialog-title" aria-describedby="achievement-dialog-summary">
    <div class="project-dialog-header">
      <p>ACHIEVEMENT DETAILS</p>
      <button class="project-dialog-close" id="achievement-dialog-close" type="button" aria-label="Close achievement details" autofocus><svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="m4 4 8 8M12 4l-8 8" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg></button>
    </div>
    <div id="achievement-dialog-content"></div>
  </dialog>
